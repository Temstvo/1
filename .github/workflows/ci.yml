name: Pilot CI
on:
  push:
    branches: ['main', 'development', 'fix/production-readiness']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appi_vpn_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appi_vpn_test
      JWT_SECRET: ci_access_secret_at_least_32_characters_long
      JWT_REFRESH_SECRET: ci_refresh_secret_at_least_32_characters_long
      VPN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NODE_ENV: test
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @appi/backend exec prisma generate
      - run: pnpm --filter @appi/backend exec prisma migrate deploy
      - run: pnpm --filter @appi/backend build
      - run: pnpm --filter @appi/backend exec jest --runInBand
        env:
          RUN_DATABASE_TESTS: 'true'
      - run: pnpm --filter @appi/frontend build
        env:
          NODE_ENV: production
      - run: node --test scripts/tests/*.test.mjs
  containers:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          tags: appi-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          tags: appi-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Validate image runtime
        run: |
          docker run --rm --entrypoint node appi-backend:ci -e "require('@prisma/client'); require('argon2'); require('./dist/modules/vpn/marzban.service'); console.log('backend dependencies OK')"
          docker run --rm --entrypoint node appi-frontend:ci -e "require('fs').accessSync('apps/frontend/server.js'); console.log('standalone server OK')"
      - name: Boot the production stack and exercise the BFF
        env:
          RELEASE_TAG: ci
        run: |
          node scripts/init-production-env.mjs
          docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --wait backend frontend
          docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend node scripts/pilot-plan.cjs
          docker compose --env-file .env.production -f docker-compose.prod.yml exec -T frontend node < scripts/container-smoke.cjs
          docker run --rm -e APP_DOMAIN=app.example.com -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Container diagnostics on failure
        if: failure()
        env:
          RELEASE_TAG: ci
        run: docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=80
