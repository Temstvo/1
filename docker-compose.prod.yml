name: appi
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appi
      POSTGRES_DB: appi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U appi -d appi']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  migrate:
    build: { context: ., dockerfile: apps/backend/Dockerfile }
    image: appi-backend:${RELEASE_TAG:-local}
    env_file: ${APPI_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql://appi:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/appi
    command: [node, node_modules/prisma/build/index.js, migrate, deploy]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
  backend:
    image: appi-backend:${RELEASE_TAG:-local}
    build: { context: ., dockerfile: apps/backend/Dockerfile }
    restart: unless-stopped
    init: true
    env_file: ${APPI_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://appi:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/appi
      FRONTEND_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
      BACKEND_URL: https://${APP_DOMAIN}
      CORS_ORIGINS: https://${APP_DOMAIN}
      TRUST_PROXY: '1'
      ENABLE_IMPORTED_VPN_ACCESS: 'false'
      PILOT_MODE: 'true'
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging: *logging
  frontend:
    build: { context: ., dockerfile: apps/frontend/Dockerfile }
    image: appi-frontend:${RELEASE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      API_URL: http://backend:3000/api
      APP_URL: https://${APP_DOMAIN}
      TRUST_PROXY: '1'
      PILOT_MODE: 'true'
      PORT: '3001'
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_DETAILS: ${OPERATOR_DETAILS:-}
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging: *logging
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend: { condition: service_healthy }
    logging: *logging
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
