services:
  - type: web
    name: appi-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SUBSCRIPTION_TOKEN
        value: K7vQ-9pL2wX4mZ8n
      - key: BACKEND_URL
        value: https://appi-backend.onrender.com
      - key: SUB_LINK_BASE_URL
        value: https://appi-backend.onrender.com
      - key: TELEGRAM_WALLET_USERNAME
        value: AppiVPNBot
      - key: CORS_ORIGINS
        value: https://appi-frontend.onrender.com

  - type: worker
    name: appi-bot
    runtime: docker
    dockerfilePath: ./apps/telegram-bot/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BACKEND_URL
        value: https://appi-backend.onrender.com
      - key: DATABASE_URL
        sync: false

  - type: web
    name: appi-frontend
    runtime: docker
    dockerfilePath: ./apps/frontend/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://appi-backend.onrender.com/api
